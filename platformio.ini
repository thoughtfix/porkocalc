; Author: 0ct0

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
custom_version = 0.1.8b-PSTH
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.sdkconfig = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 460800

; Build flags
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DPORKCHOP_LOG_ENABLED=0
    -include src/core/logging.h
    -DARDUINO_M5Stack_StampS3
    ; NimBLE: Disable PSRAM usage (not available on this board)
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    ; NimBLE: Reduce log verbosity (0=NONE, 1=ERROR, 2=WARNING, 3=INFO, 4=DEBUG)
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    ; SPI pins for M5Cardputer SD card

    ; Allow multiple definitions to override ieee80211_raw_frame_sanity_check
    -Wl,-zmuldefs
    -Os

; Libraries - using compatible versions from m5stack repo
lib_deps = 
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1
    bblanchon/ArduinoJson@^7.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7

; Extra scripts
extra_scripts = pre:scripts/pre_build.py

[env:m5cardputer-debug]
extends = env:m5cardputer
build_type = debug
build_flags = 
    ${env:m5cardputer.build_flags}
    -DPORKCHOP_LOG_ENABLED=1
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4

[env:picocalc]
; Porkocalc: PorkChop on a ClockworkPi PicoCalc with a Waveshare ESP32-S3-Pico core.
; Hardware drivers and the Cardputer compatibility layer come from picocalc-esp32.
; M5Unified and M5Cardputer are deliberately NOT in lib_deps. boards/picocalc/include provides
; M5Unified.h / M5Cardputer.h that forward to <PicoCalcCardputer.h>. (M5Unified's board
; auto-detection probes pins on unknown hardware, which isn't safe on a PicoCalc.)
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
custom_version = 0.3.0-beta
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; ESP32-S3R2: 16 MB QIO flash, 2 MB quad PSRAM in package. The 8 MB partition table fits as is.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.sdkconfig = sdkconfig.defaults
monitor_speed = 115200
; Opening the native USB port with DTR/RTS asserted reboots the S3 into download mode.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800

build_flags =
    -DPORKOCALC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DPORKCHOP_LOG_ENABLED=0
    -include src/core/logging.h
    -I boards/picocalc/include
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    -Wl,-zmuldefs
    -Os

lib_deps =
    ; PicoCalc drivers + Cardputer-compat layer. PlatformIO fetches this automatically on build, so
    ; a plain `git clone` of Porkocalc carries it along -- no submodule init needed. Pinned to a
    ; tagged release so upstream changes to picocalc-esp32 can't break a Porkocalc build; bump the
    ; tag deliberately when adopting a newer driver library.
    ; For developing BOTH repos side by side, comment the git line and uncomment the symlink:
    https://github.com/thoughtfix/picocalc-esp32.git#v0.1.0
    ; symlink://../picocalc-esp32
    bblanchon/ArduinoJson@^7.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7

extra_scripts = pre:scripts/pre_build.py

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
test_build_src = false

[env:native_coverage]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
    -O0
    -g
    -fprofile-arcs
    -ftest-coverage
    -lgcov
    --coverage
build_unflags =
    -O2
    -O3
test_build_src = false
